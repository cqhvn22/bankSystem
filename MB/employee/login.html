<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>MB Bank - Đăng nhập Nhân viên</title>
    <link rel="stylesheet" href="../assets/theme.css">
    <style>
        body { background: linear-gradient(135deg, #1f2937 0%, #111827 100%); display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .login-wrapper { display: flex; background: rgba(255, 255, 255, 0.95); border-radius: 24px; box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3); overflow: hidden; width: 900px; max-width: 95%; }
        .login-banner { flex: 1; background: linear-gradient(135deg, var(--mb-red) 0%, #aa141a 100%); color: white; padding: 50px; display: flex; flex-direction: column; justify-content: center; position: relative; }
        .login-banner h2 { font-size: 32px; margin-bottom: 20px; font-weight: 700; z-index: 1;}
        .login-banner p { font-size: 16px; opacity: 0.9; line-height: 1.6; z-index: 1;}
        .login-form-container { flex: 1; padding: 50px; display: flex; flex-direction: column; justify-content: center; }
        .input-group { margin-bottom: 20px; }
        .input-group label { display: block; margin-bottom: 8px; font-weight: 600; color: #444; font-size: 14px; }
        .input-group input { width: 100%; padding: 14px; border-radius: 10px; border: 2px solid #eee; font-size: 15px; transition: 0.3s; }
        .input-group input:focus { border-color: var(--mb-red); outline: none; box-shadow: 0 0 0 3px rgba(227, 27, 35, 0.1); }
        .btn-login { width: 100%; padding: 15px; font-size: 16px; background: var(--mb-red); }
    </style>
</head>
<body>
    <div class="login-wrapper fade-in">
        <div class="login-banner">
            <div class="logo-container" style="margin-bottom: 30px; z-index: 1;">
                <div class="mb-star" style="background: white;"></div>
                <div class="logo-text-group">
                    <div class="logo-main" style="color: white;">MB</div>
                    <div class="logo-sub" style="color: rgba(255,255,255,0.7);">EMPLOYEE</div>
                </div>
            </div>
            <h2>Hệ thống<br>Nhân viên Ngân Hàng</h2>
            <p>Hệ thống xử lý giao dịch và hỗ trợ khách hàng MB Bank.</p>
        </div>
        
        <div class="login-form-container">
            <h3 style="margin-bottom: 25px; color: #333; font-size: 24px;">Đăng nhập Nhân viên</h3>
            <div class="input-group">
                <label>Mã nhân viên (User ID)</label>
                <input type="text" placeholder="Nhập mã nhân viên">
            </div>
            <div class="input-group">
                <label>Mật khẩu nghiệp vụ</label>
                <input type="password" placeholder="Nhập mật khẩu nội bộ">
            </div>
            <button class="btn-primary btn-login" style="margin-top: 10px;" onclick="location.href='dashboard.html'">ĐĂNG NHẬP NGHIỆP VỤ</button>
        </div>
    </div>
</body>
</html>

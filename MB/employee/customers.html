<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Quản lý Khách Hàng</title>
    <link rel="stylesheet" href="../assets/theme.css">
    <style>
        .admin-layout { display: flex; min-height: 100vh; }
        .sidebar { width: 280px; background: white; border-right: 1px solid #ddd; padding: 30px 0; }
        .sidebar-item { padding: 15px 30px; display: flex; align-items: center; gap: 15px; color: #666; text-decoration: none; font-weight: 500; }
        .sidebar-item.active { background: var(--mb-blue); color: white; }
        .content { flex: 1; padding: 40px; }
        .search-bar { display: flex; gap: 10px; margin-bottom: 20px; }
        .search-bar input { flex: 1; padding: 12px; border-radius: 10px; border: 1px solid #ddd; }
    </style>
</head>
<body>
    <div class="admin-layout">
        <aside class="sidebar">
            <div class="logo-container" style="padding: 0 30px 40px;">
                <div class="mb-star"></div>
                <div class="logo-text-group"><div class="logo-main">MB</div><div class="logo-sub">EMPLOYEE</div></div>
            </div>
            <a href="dashboard.html" class="sidebar-item">🏠 Giao diện Giao dịch</a>
            <a href="customers.html" class="sidebar-item active">👥 Quản lý khách hàng</a>
            <a href="accounts.html" class="sidebar-item">💳 Quản lý tài khoản</a>
        </aside>

        <main class="content">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
                <h2>Danh sách Khách Hàng (Customer)</h2>
                <button class="btn-primary">+ Tiếp nhận yêu cầu mở TK</button>
            </div>

            <div class="card fade-in">

                    <input type="text" placeholder="Tìm kiếm theo Mã KH, CCCD, Số ĐT...">
                    <button class="btn-primary">Tìm kiếm</button>
                </div>
                <table style="width: 100%; border-collapse: collapse;">
                    <thead>
                        <tr style="text-align: left; border-bottom: 2px solid #eee; color: #888;">
                            <th style="padding: 15px;">Mã KH</th>
                            <th>Họ Tên / Ngày Sinh</th>
                            <th>CCCD</th>
                            <th>Liên hệ (SĐT/Email)</th>
                            <th>Địa chỉ</th>
                            <th>Thao tác</th>
                        </tr>
                    </thead>
                    <tbody id="customers-body">
                        <!-- Data will be populated here -->
                    </tbody>
                </table>
            </div>
        </main>
    </div>

<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>MB Bank - Đăng nhập Khách hàng</title>
    <link rel="stylesheet" href="../assets/theme.css">
    <style>
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .login-wrapper {
            display: flex;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            width: 900px;
            max-width: 95%;
            backdrop-filter: blur(10px);
        }
        .login-banner {
            flex: 1;
            background: linear-gradient(135deg, var(--mb-blue) 0%, #002D7A 100%);
            color: white;
            padding: 50px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
        }
        .login-banner h2 { font-size: 32px; margin-bottom: 20px; font-weight: 700; z-index: 1;}
        .login-banner p { font-size: 16px; opacity: 0.9; line-height: 1.6; z-index: 1;}
        .login-banner::after {
            content: "";
            position: absolute;
            right: -50px;
            bottom: -50px;
            width: 300px;
            height: 300px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 50%;
        }
        
        .login-form-container {
            flex: 1;
            padding: 50px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .input-group {
            margin-bottom: 20px;
        }
        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #444;
            font-size: 14px;
        }
        .input-group input {
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            border: 2px solid #eee;
            font-size: 15px;
            transition: 0.3s;
        }
        .input-group input:focus {
            border-color: var(--mb-blue);
            outline: none;
            box-shadow: 0 0 0 3px rgba(0, 71, 186, 0.1);
        }
        .forgot-password {
            text-align: right;
            margin-bottom: 20px;
            display: block;
            font-size: 13px;
            color: var(--mb-blue);
            text-decoration: none;
            font-weight: 500;
        }
        .btn-login {
            width: 100%;
            padding: 15px;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div class="login-wrapper fade-in">
        <div class="login-banner">
            <div class="logo-container" style="margin-bottom: 30px; z-index: 1;">
                <div class="mb-star" style="background: white;"></div>
                <div class="logo-text-group">
                    <div class="logo-main" style="color: white;">MB</div>
                    <div class="logo-sub" style="color: rgba(255,255,255,0.7);">BANK</div>
                </div>
            </div>
            <h2>Ngân hàng số<br>thông minh</h2>
            <p>Trải nghiệm dịch vụ tài chính hiện đại, nhanh chóng và bảo mật tuyệt đối với MB Bank.</p>
        </div>
        
        <div class="login-form-container">
            <h3 style="margin-bottom: 25px; color: #333; font-size: 24px;">Đăng nhập</h3>
            <div class="input-group">
                <label>Tên đăng nhập / Số điện thoại</label>
                <input type="text" placeholder="Nhập tên đăng nhập">
            </div>
            <div class="input-group">
                <label>Mật khẩu</label>
                <input type="password" placeholder="Nhập mật khẩu">
            </div>
            <a href="#" class="forgot-password">Quên mật khẩu?</a>
            <button class="btn-primary btn-login" onclick="location.href='dashboard.html'">ĐĂNG NHẬP</button>
        </div>
    </div>
</body>
</html>

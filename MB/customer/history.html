<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Lịch sử giao dịch</title>
    <link rel="stylesheet" href="../assets/theme.css">
</head>
<body>
    <div style="max-width: 800px; margin: 40px auto; padding: 20px;">
        <h2 style="margin-bottom: 30px;">Lịch sử giao dịch</h2>
        <div class="card fade-in" id="history-container">
            <!-- Data will be loaded via JS -->
        </div>
        <button class="btn-primary" style="margin-top: 30px; width: 100%; background: #eee; color: #333;" onclick="location.href='dashboard.html'">QUAY LẠI</button>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const data = [
    {
        "month": "Tháng 4 / 2026",
        "transactions": [
            { "type": "out", "icon": "↑", "icon_bg": "#ffe5e6", "icon_color": "var(--mb-red)", "title": "Chuyển tiền cho Bùi Tuấn Anh", "time": "05/04/2026 - 15:30", "amount": "- 5,000,000 VND", "amount_color": "var(--mb-red)", "content": "Tra tien an trua" },
            { "type": "out", "icon": "📄", "icon_bg": "#fff4e5", "icon_color": "#ff9800", "title": "Thanh toán hóa đơn điện", "time": "03/04/2026 - 09:15", "amount": "- 1,250,000 VND", "amount_color": "var(--mb-red)", "content": "EVN HANOI" },
            { "type": "in",  "icon": "↓", "icon_bg": "#dff0e4", "icon_color": "#28a745", "title": "Nhận tiền từ MB Bank", "time": "01/04/2026 - 08:00", "amount": "+ 20,000,000 VND", "amount_color": "#28a745", "content": "Luong thang 03/2026" },
            { "type": "out", "icon": "↑", "icon_bg": "#ffe5e6", "icon_color": "var(--mb-red)", "title": "Chuyển tiền thanh toán xe", "time": "01/04/2026 - 07:15", "amount": "- 850,000 VND", "amount_color": "var(--mb-red)", "content": "Thanh toan truyen di GRAB" },
            { "type": "in",  "icon": "↓", "icon_bg": "#dff0e4", "icon_color": "#28a745", "title": "Nhận tiền từ Nguyễn Hoàng Sơn", "time": "01/04/2026 - 06:45", "amount": "+ 2,000,000 VND", "amount_color": "#28a745", "content": "Tra no" }
        ]
    },
    {
        "month": "Tháng 3 / 2026",
        "transactions": [
            { "type": "out", "icon": "↑", "icon_bg": "#ffe5e6", "icon_color": "var(--mb-red)", "title": "Chuyển tiền TIKI.VN", "time": "25/03/2026 - 19:40", "amount": "- 850,000 VND", "amount_color": "var(--mb-red)", "content": "Thanh toan don hang" },
            { "type": "out", "icon": "📄", "icon_bg": "#fff4e5", "icon_color": "#ff9800", "title": "Thanh toán Internet FPT", "time": "22/03/2026 - 14:20", "amount": "- 330,000 VND", "amount_color": "var(--mb-red)", "content": "Hoa don cap quang FPT" },
            { "type": "in",  "icon": "↓", "icon_bg": "#dff0e4", "icon_color": "#28a745", "title": "Nạp tiền từ ShopeePay", "time": "18/03/2026 - 11:15", "amount": "+ 1,500,000 VND", "amount_color": "#28a745", "content": "Rut tien tu ShopeePay" },
            { "type": "out", "icon": "↑", "icon_bg": "#ffe5e6", "icon_color": "var(--mb-red)", "title": "Nạp tiền điện thoại Viettel", "time": "15/03/2026 - 09:00", "amount": "- 100,000 VND", "amount_color": "var(--mb-red)", "content": "Nap the dien thoai 09xxxx8888" },
            { "type": "in",  "icon": "↓", "icon_bg": "#dff0e4", "icon_color": "#28a745", "title": "Thưởng tết âm lịch", "time": "05/03/2026 - 16:30", "amount": "+ 10,000,000 VND", "amount_color": "#28a745", "content": "Thuong KPI quy 4" }
        ]
    },
    {
        "month": "Tháng 2 / 2026",
        "transactions": [
            { "type": "out", "icon": "📄", "icon_bg": "#fff4e5", "icon_color": "#ff9800", "title": "Thanh toán vé máy bay VNA", "time": "28/02/2026 - 20:00", "amount": "- 4,500,000 VND", "amount_color": "var(--mb-red)", "content": "Ve chuyen bay HAN-SGN" },
            { "type": "out", "icon": "↑", "icon_bg": "#ffe5e6", "icon_color": "var(--mb-red)", "title": "Chuyển tiền mua sắm Tết", "time": "15/02/2026 - 10:10", "amount": "- 12,000,000 VND", "amount_color": "var(--mb-red)", "content": "Mua sam do tet" },
            { "type": "in",  "icon": "↓", "icon_bg": "#dff0e4", "icon_color": "#28a745", "title": "Hoàn tiền thẻ tín dụng", "time": "07/02/2026 - 14:00", "amount": "+ 450,000 VND", "amount_color": "#28a745", "content": "Cashback thang 1" }
        ]
    },
    {
        "month": "Tháng 1 / 2026",
        "transactions": [
            { "type": "out", "icon": "↑", "icon_bg": "#ffe5e6", "icon_color": "var(--mb-red)", "title": "Chuyển tiền quyên góp quỹ", "time": "10/01/2026 - 08:30", "amount": "- 200,000 VND", "amount_color": "var(--mb-red)", "content": "Quyen gop vi trien vong" },
            { "type": "out", "icon": "📄", "icon_bg": "#fff4e5", "icon_color": "#ff9800", "title": "Thanh toán Hóa đơn nước", "time": "04/01/2026 - 09:12", "amount": "- 150,000 VND", "amount_color": "var(--mb-red)", "content": "Thanh toan nuoc sinh hoat" },
            { "type": "in",  "icon": "↓", "icon_bg": "#dff0e4", "icon_color": "#28a745", "title": "Lãi suất tiết kiệm", "time": "01/01/2026 - 02:00", "amount": "+ 3,450,000 VND", "amount_color": "#28a745", "content": "Tra lai so tiet kiem 01/2026" }
        ]
    }
];

            const container = document.getElementById('history-container');
            
            data.forEach(monthGroup => {
                const header = document.createElement('div');
                header.style.cssText = 'display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #e9edf7; padding-bottom: 15px; margin-bottom: 15px; margin-top: 20px;';
                header.innerHTML = `<h3 style="font-size: 16px; color: var(--text-muted); text-transform: uppercase;">${monthGroup.month}</h3>`;
                container.appendChild(header);

                monthGroup.transactions.forEach(tx => {
                    const txDiv = document.createElement('div');
                    txDiv.style.cssText = 'display: flex; justify-content: space-between; padding: 15px 0; border-bottom: 1px solid #eee; transition: 0.2s;';
                    txDiv.innerHTML = `
                        <div style="display: flex; gap: 15px; align-items: center;">
                            <div style="width: 45px; height: 45px; background: ${tx.icon_bg}; color: ${tx.icon_color}; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 20px;">${tx.icon}</div>
                            <div>
                                <p style="font-weight: 700; font-size: 15px;">${tx.title}</p>
                                <p style="font-size: 12px; color: var(--text-muted); margin-top: 3px;">${tx.time}</p>
                            </div>
                        </div>
                        <div style="text-align: right;">
                            <p style="color: ${tx.amount_color}; font-weight: 700; font-size: 16px;">${tx.amount}</p>
                            <p style="font-size: 12px; color: var(--text-muted); margin-top: 3px;">${tx.content}</p>
                        </div>
                    `;
                    container.appendChild(txDiv);
                });
            });
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>MB Bank - Đăng nhập Nhân viên</title>
    <link rel="stylesheet" href="../assets/theme.css">
    <style>
        body { background: linear-gradient(135deg, #1f2937 0%, #111827 100%); display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .login-wrapper { display: flex; background: rgba(255, 255, 255, 0.95); border-radius: 24px; box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3); overflow: hidden; width: 900px; max-width: 95%; }
        .login-banner { flex: 1; background: linear-gradient(135deg, var(--mb-red) 0%, #aa141a 100%); color: white; padding: 50px; display: flex; flex-direction: column; justify-content: center; position: relative; }
        .login-banner h2 { font-size: 32px; margin-bottom: 20px; font-weight: 700; z-index: 1;}
        .login-banner p { font-size: 16px; opacity: 0.9; line-height: 1.6; z-index: 1;}
        .login-form-container { flex: 1; padding: 50px; display: flex; flex-direction: column; justify-content: center; }
        .input-group { margin-bottom: 20px; }
        .input-group label { display: block; margin-bottom: 8px; font-weight: 600; color: #444; font-size: 14px; }
        .input-group input { width: 100%; padding: 14px; border-radius: 10px; border: 2px solid #eee; font-size: 15px; transition: 0.3s; box-sizing: border-box; }
        .input-group input:focus { border-color: var(--mb-red); outline: none; box-shadow: 0 0 0 3px rgba(227, 27, 35, 0.1); }
        .btn-login { width: 100%; padding: 15px; font-size: 16px; background: var(--mb-red); border: none; color: white; border-radius: 12px; font-weight: 700; cursor: pointer; }
    </style>
</head>
<body>
    <div class="login-wrapper fade-in">
        <div class="login-banner">
            <div class="logo-container" style="margin-bottom: 30px; z-index: 1;">
                <div class="mb-star" style="background: white;"></div>
                <div class="logo-text-group">
                    <div class="logo-main" style="color: white;">MB</div>
                    <div class="logo-sub" style="color: rgba(255,255,255,0.7);">EMPLOYEE</div>
                </div>
            </div>
            <h2>Hệ thống<br>Nhân viên Ngân Hàng</h2>
            <p>Hệ thống xử lý giao dịch và hỗ trợ khách hàng MB Bank.</p>
        </div>
        
        <div class="login-form-container">
            <h3 style="margin-bottom: 25px; color: #333; font-size: 24px;">Đăng nhập Nhân viên</h3>
            <div class="input-group">
                <label>Mã nhân viên (User ID)</label>
                <input type="text" id="username" placeholder="Nhập mã nhân viên">
            </div>
            <div class="input-group">
                <label>Mật khẩu nghiệp vụ</label>
                <input type="password" id="password" placeholder="Nhập mật khẩu nội bộ">
            </div>
            <button class="btn-login" id="loginBtn" onclick="doLogin()">ĐĂNG NHẬP NGHIỆP VỤ</button>
            <div id="error-msg" style="color: var(--mb-red); font-size: 13px; margin-top: 15px; text-align: center; display: none;"></div>
        </div>
    </div>

    <script>
        // Auto-redirect if already logged in
        const role = localStorage.getItem('userRole');
        const token = localStorage.getItem('token');
        if (token && role) {
            if (role === 'ROLE_EMPLOYEE' || role === 'ROLE_BRANCH_MANAGER') { window.location.replace('index.html'); }
            else if (role === 'ROLE_CUSTOMER') { window.location.replace('../customer/index.html'); }
            else if (role === 'ROLE_SYSADMIN') { window.location.replace('../sysadmin/index.html'); }
        }

        async function doLogin() {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const errorEl = document.getElementById('error-msg');
            const btn = document.getElementById('loginBtn');

            if (!username || !password) {
                errorEl.textContent = 'Vui lòng nhập mã nhân viên và mật khẩu';
                errorEl.style.display = 'block';
                return;
            }

            try {
                btn.disabled = true;
                btn.textContent = 'Đang xác thực...';

                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await res.json();

                if (res.ok) {
                    if (data.role === 'ROLE_CUSTOMER') {
                        errorEl.textContent = 'Tài khoản khách hàng không thể vào trang nghiệp vụ!';
                        errorEl.style.display = 'block';
                        btn.disabled = false;
                        btn.textContent = 'ĐĂNG NHẬP NGHIỆP VỤ';
                        return;
                    }
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('user', JSON.stringify(data));
                    localStorage.setItem('username', data.username);
                    localStorage.setItem('fullName', data.fullName);
                    localStorage.setItem('userRole', data.role);
                    if (data.id) localStorage.setItem('userId', data.id);
                    window.location.replace('index.html');
                } else {
                    errorEl.textContent = data.message || 'Mã nhân viên hoặc mật khẩu nghiệp vụ không chính xác';
                    errorEl.style.display = 'block';
                }
            } catch (err) {
                errorEl.textContent = 'Không thể kết nối đến máy chủ nội bộ';
                errorEl.style.display = 'block';
            } finally {
                btn.disabled = false;
                btn.textContent = 'ĐĂNG NHẬP NGHIỆP VỤ';
            }
        }

        document.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
    </script>
</body>
</html>

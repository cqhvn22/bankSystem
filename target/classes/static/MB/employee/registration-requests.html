<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Duyệt tài khoản mới - MB Bank</title>
    <link rel="stylesheet" href="../assets/theme.css">
    <style>
        .admin-layout { display: flex; min-height: 100vh; background: #f4f7fe; }
        .sidebar { width: 280px; background: white; border-right: 1px solid #e2e8f0; padding: 30px 0; }
        .sidebar-item { padding: 15px 30px; display: flex; align-items: center; gap: 15px; color: #64748b; text-decoration: none; font-weight: 600; transition: 0.3s; }
        .sidebar-item.active { background: #f0f7ff; color: var(--mb-blue); border-right: 4px solid var(--mb-blue); }
        .content { flex: 1; padding: 40px; }
        .req-card { background: white; border-radius: 20px; padding: 25px; margin-bottom: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.03); border: 1px solid #edf2f7; display: flex; justify-content: space-between; align-items: center; }
        .req-info h4 { font-size: 18px; color: #1a202c; margin-bottom: 5px; }
        .req-details { font-size: 13px; color: #64748b; display: flex; gap: 20px; margin-top: 10px; }
        .req-details span { display: flex; align-items: center; gap: 5px; }
        .actions { display: flex; gap: 10px; }
        .btn-approve { background: #10b981; color: white; border: none; padding: 10px 20px; border-radius: 10px; font-weight: 700; cursor: pointer; }
        .btn-reject { background: #ef4444; color: white; border: none; padding: 10px 20px; border-radius: 10px; font-weight: 700; cursor: pointer; }
    </style>
</head>
<body>
    <div class="admin-layout">
        <aside class="sidebar">
            <div class="logo-container" style="padding: 0 30px 40px;">
                <div class="mb-star"></div>
                <div class="logo-text-group"><div class="logo-main">MB</div><div class="logo-sub">EMPLOYEE</div></div>
            </div>
            <a href="index.html" class="sidebar-item"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg> Giao diện Giao dịch</a>
            <a href="customers.html" class="sidebar-item"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg> Quản lý khách hàng</a>
            <a href="accounts.html" class="sidebar-item"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"></rect><line x1="1" y1="10" x2="23" y2="10"></line></svg> Quản lý tài khoản</a>
            <a href="registration-requests.html" class="sidebar-item active"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg> Duyệt tài khoản mới</a>
        </aside>

        <main class="content">
            <div style="margin-bottom: 30px;">
                <h2 style="font-size: 28px; color: #1a202c;">Yêu cầu đăng ký tài khoản mới</h2>
                <p style="color: #64748b;">Danh sách khách hàng đăng ký trực tuyến tại chi nhánh của bạn</p>
            </div>

            <div id="requests-list">
                <div style="text-align: center; padding: 50px; color: #888;">Đang tải yêu cầu...</div>
            </div>
        </main>
    </div>

    <script>
        const API_BASE = '/api';
        const token = localStorage.getItem('token');
        const user = JSON.parse(localStorage.getItem('user') || '{}');
        
        if (!token) window.location.href = 'login.html';

        async function fetchWithAuth(url, options = {}) {
            const res = await fetch(url, {
                ...options,
                headers: { 
                    ...options.headers, 
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': 'application/json'
                }
            });
            if (res.status === 401) {
                localStorage.clear();
                window.location.href = 'login.html';
            }
            return res;
        }

        async function loadRequests() {
            try {
                // Determine endpoint based on role
                const endpoint = user.role === 'ROLE_SYSADMIN' ? '/registration/all' : '/registration/branch/list';
                const res = await fetchWithAuth(`${API_BASE}${endpoint}?status=PENDING`);
                const data = await res.json();
                const container = document.getElementById('requests-list');
                container.innerHTML = '';

                if (!data || data.length === 0) {
                    container.innerHTML = '<div style="text-align:center; padding:50px; background:white; border-radius:20px;">Hiện không có yêu cầu nào chờ duyệt.</div>';
                    return;
                }

                data.forEach(req => {
                    const div = document.createElement('div');
                    div.className = 'req-card fade-in';
                    div.innerHTML = `
                        <div class="req-info">
                            <h4>${req.fullName}</h4>
                            <div style="color:var(--mb-blue); font-weight:700; font-size:14px;">Username: ${req.desiredUsername}</div>
                            <div class="req-details">
                                <span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2" width="14" height="20" rx="2" ry="2"></rect><line x1="12" y1="18" x2="12.01" y2="18"></line></svg> ${req.phone}</span>
                                <span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg> ${req.cccd}</span>
                                <span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg> ${req.address}</span>
                            </div>
                        </div>
                        <div class="actions">
                            <button class="btn-reject" onclick="review(${req.id}, 'REJECT')">Từ chối</button>
                            <button class="btn-approve" onclick="review(${req.id}, 'APPROVE')">Duyệt active</button>
                        </div>
                    `;
                    container.appendChild(div);
                });
            } catch (err) { 
                console.error(err);
                document.getElementById('requests-list').innerHTML = '<div style="text-align:center; padding:50px; color:red;">Lỗi tải dữ liệu. Vui lòng kiểm tra phân quyền chi nhánh.</div>';
            }
        }

        async function review(id, action) {
            let reason = action === 'REJECT' ? prompt('Nhập lý do từ chối:') : '';
            if (action === 'REJECT' && reason === null) return;

            try {
                const method = action === 'APPROVE' ? 'approve' : 'reject';
                const options = { method: 'POST' };
                if (action === 'REJECT') {
                    options.body = JSON.stringify({ reason: reason || 'Không đáp ứng yêu cầu' });
                }

                const res = await fetchWithAuth(`${API_BASE}/registration/${id}/${method}`, options);
                if (res.ok) {
                    alert(action === 'APPROVE' ? 'Đã kích hoạt tài khoản thành công!' : 'Đã từ chối yêu cầu.');
                    loadRequests();
                } else {
                    const errorData = await res.json();
                    alert('Lỗi: ' + (errorData.message || 'Thao tác thất bại'));
                }
            } catch (err) { alert('Lỗi kết nối'); }
        }

        loadRequests();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>MB Bank - Đăng nhập Khách hàng</title>
    <link rel="stylesheet" href="../assets/theme.css">
    <style>
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .login-wrapper {
            display: flex;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            width: 900px;
            max-width: 95%;
            backdrop-filter: blur(10px);
        }
        .login-banner {
            flex: 1;
            background: linear-gradient(135deg, var(--mb-blue) 0%, #002D7A 100%);
            color: white;
            padding: 50px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
        }
        .login-banner h2 { font-size: 32px; margin-bottom: 20px; font-weight: 700; z-index: 1;}
        .login-banner p { font-size: 16px; opacity: 0.9; line-height: 1.6; z-index: 1;}
        
        .login-form-container {
            flex: 1;
            padding: 50px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .input-group { margin-bottom: 20px; }
        .input-group label { display: block; margin-bottom: 8px; font-weight: 600; color: #444; font-size: 14px; }
        .input-group input { width: 100%; padding: 14px; border-radius: 10px; border: 2px solid #eee; font-size: 15px; transition: 0.3s; }
        .input-group input:focus { border-color: var(--mb-blue); outline: none; }
        .btn-login { width: 100%; padding: 15px; font-size: 16px; font-weight: 700; }
    </style>
</head>
<body>
    <div class="login-wrapper fade-in">
        <div class="login-banner">
            <div class="logo-container" style="margin-bottom: 30px; z-index: 1;">
                <div class="mb-star" style="background: white;"></div>
                <div class="logo-text-group"><div class="logo-main" style="color: white;">MB</div><div class="logo-sub" style="color: rgba(255,255,255,0.7);">BANK</div></div>
            </div>
            <h2>Ngân hàng số<br>thông minh</h2>
            <p>Trải nghiệm dịch vụ tài chính hiện đại với MB Bank.</p>
        </div>
        
        <div class="login-form-container">
            <h3 style="margin-bottom: 25px; color: #333; font-size: 24px;">Đăng nhập</h3>
            <div class="input-group">
                <label>Tên đăng nhập / Số điện thoại</label>
                <input type="text" id="username" placeholder="Nhập tên đăng nhập">
            </div>
            <div class="input-group">
                <label>Mật khẩu</label>
                <input type="password" id="password" placeholder="Nhập mật khẩu">
            </div>
            <button class="btn-primary btn-login" id="loginBtn">ĐĂNG NHẬP</button>
            <div id="error-msg" style="color: var(--mb-red); font-size: 13px; margin-top: 15px; text-align: center; display: none;"></div>
            <div style="text-align: center; margin-top: 20px; font-size: 14px; color: #666;">
                Chưa có tài khoản? <a href="register.html" style="color: var(--mb-blue); font-weight: 600; text-decoration: none;">Đăng ký ngay</a>
            </div>
        </div>
    </div>

    <script>
        // Auto-redirect if already logged in
        const role = localStorage.getItem('userRole');
        const token = localStorage.getItem('token');
        if (token && role) {
            if (role === 'ROLE_CUSTOMER') { window.location.href = 'dashboard.html'; return; }
            else if (role === 'ROLE_EMPLOYEE') { window.location.href = '../employee/dashboard.html'; return; }
            else if (role === 'ROLE_SYSADMIN') { window.location.href = '../sysadmin/dashboard.html'; return; }
        }

        const API_BASE = '/api';
        document.getElementById('loginBtn').addEventListener('click', async () => {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const errorEl = document.getElementById('error-msg');
            const btn = document.getElementById('loginBtn');

            if (!username || !password) {
                errorEl.textContent = 'Vui lòng nhập tên đăng nhập và mật khẩu';
                errorEl.style.display = 'block';
                return;
            }

            try {
                btn.disabled = true; btn.textContent = 'Đang đăng nhập...';
                const res = await fetch(`${API_BASE}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();
                if (res.ok) {
                    if (data.role !== 'ROLE_CUSTOMER') {
                        errorEl.textContent = 'Tài khoản này không phải là khách hàng!';
                        errorEl.style.display = 'block';
                        btn.disabled = false; btn.textContent = 'ĐĂNG NHẬP';
                        return;
                    }
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('user', JSON.stringify(data));
                    localStorage.setItem('username', data.username);
                    localStorage.setItem('fullName', data.fullName);
                    localStorage.setItem('userRole', data.role);
                    window.location.href = 'dashboard.html';
                } else {
                    errorEl.textContent = data.message || 'Tên đăng nhập hoặc mật khẩu không chính xác';
                    errorEl.style.display = 'block';
                }
            } catch (err) {
                errorEl.textContent = 'Không thể kết nối đến máy chủ';
                errorEl.style.display = 'block';
            } finally {
                btn.disabled = false; btn.textContent = 'ĐĂNG NHẬP';
            }
        });
    </script>
</body>
</html>

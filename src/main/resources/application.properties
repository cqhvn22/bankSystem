spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/mbbank_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&characterEncoding=UTF-8&useUnicode=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# =========================
# JPA / HIBERNATE
# =========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# =========================
# JWT
# =========================
# Cố định secret này để không bị logout khi deploy lại
jwt.secret=${JWT_SECRET:413F4428472B4B6250655368566D5970337336763979244226452948404D6351}
jwt.expiration=${JWT_EXPIRATION:86400000}

# =========================
# LOGGING (Quan trọng để debug trên Render)
# =========================
logging.level.org.springframework.security=DEBUG
logging.level.com.mbbank.mbbSystem=DEBUG
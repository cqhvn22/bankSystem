<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Duyệt tài khoản mới - MB Bank</title>
    <link rel="stylesheet" href="../assets/theme.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        .admin-layout { display: flex; min-height: 100vh; background: #f4f7fe; }
        .sidebar { width: 280px; background: white; border-right: 1px solid #e2e8f0; padding: 30px 0; }
        .sidebar-item { padding: 15px 30px; display: flex; align-items: center; gap: 15px; color: #64748b; text-decoration: none; font-weight: 600; transition: 0.3s; }
        .sidebar-item.active { background: #f0f7ff; color: var(--mb-blue); border-right: 4px solid var(--mb-blue); }
        .content { flex: 1; padding: 40px; }
        .req-card { background: white; border-radius: 20px; padding: 25px; margin-bottom: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.03); border: 1px solid #edf2f7; display: flex; justify-content: space-between; align-items: center; }
        .req-info h4 { font-size: 18px; color: #1a202c; margin-bottom: 5px; }
        .req-details { font-size: 13px; color: #64748b; display: flex; gap: 20px; margin-top: 10px; }
        .req-details span { display: flex; align-items: center; gap: 5px; }
        .actions { display: flex; gap: 10px; }
        .btn-details { background: #64748b; color: white; border: none; padding: 10px 15px; border-radius: 10px; font-weight: 700; cursor: pointer; }
        .btn-approve { background: #10b981; color: white; border: none; padding: 10px 20px; border-radius: 10px; font-weight: 700; cursor: pointer; }
        .btn-reject { background: #ef4444; color: white; border: none; padding: 10px 20px; border-radius: 10px; font-weight: 700; cursor: pointer; }

        /* Modal Details */
        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 1000; align-items: center; justify-content: center; }
        .modal-overlay.open { display: flex; }
        .modal-box { background: white; border-radius: 24px; padding: 35px; width: 600px; max-width: 90vw; box-shadow: 0 20px 50px rgba(0,0,0,0.15); position: relative; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; border-bottom: 1px solid #eee; padding-bottom: 15px; }
        .modal-close { cursor: pointer; background: #f1f5f9; border-radius: 50%; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; border: none; font-size: 18px; }
        .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .detail-item label { display: block; font-size: 11px; text-transform: uppercase; color: #94a3b8; font-weight: 700; margin-bottom: 4px; }
        .detail-item p { font-size: 15px; color: #1e293b; font-weight: 600; margin: 0; }
    </style>
</head>
<body>
    <div class="admin-layout">
        <aside class="sidebar">
            <div class="logo-container" style="padding: 0 30px 40px;">
                <div class="mb-star"></div>
                <div class="logo-text-group"><div class="logo-main">MB</div><div class="logo-sub">EMPLOYEE</div></div>
            </div>
            <a href="index.html" class="sidebar-item"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg> Giao diện Giao dịch</a>
            <a href="customers.html" class="sidebar-item"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg> Khách hàng & Tài khoản</a>
            <a href="registration-requests.html" class="sidebar-item active"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg> Duyệt tài khoản mới</a>
            <a href="branch-employees.html" class="sidebar-item" id="nav-branch-emp" style="display:none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg> Quản lý nhân viên</a>
        </aside>

        <main class="content">
            <div style="margin-bottom: 30px;">
                <h2 style="font-size: 28px; color: #1a202c;">Yêu cầu đăng ký tài khoản mới</h2>
                <p style="color: #64748b;">Danh sách khách hàng đăng ký trực tuyến tại chi nhánh của bạn</p>
            </div>

            <div id="requests-list">
                <div style="text-align: center; padding: 50px; color: #888;">Đang tải yêu cầu...</div>
            </div>
        </main>
    </div>

    <!-- Modal Chi tiết -->
    <div class="modal-overlay" id="details-modal">
        <div class="modal-box">
            <div class="modal-header">
                <h3 style="margin:0; font-size:20px;">Chi tiết yêu cầu đăng ký</h3>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <div class="detail-grid" id="modal-content">
                <!-- Nội dung sẽ được điền bằng JS -->
            </div>
            <div style="margin-top: 30px; display: flex; justify-content: flex-end; gap: 10px; border-top: 1px solid #eee; padding-top: 20px;">
                <button class="btn-reject" id="btn-modal-reject">Từ chối</button>
                <button class="btn-approve" id="btn-modal-approve">Duyệt active</button>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = '/api';
        const token = localStorage.getItem('token');
        const user = JSON.parse(localStorage.getItem('user') || '{}');
        const userRole = localStorage.getItem('userRole');
        let currentRequests = [];

        // Auth check — cho phép cả BRANCH_MANAGER
        if (!token || !['ROLE_EMPLOYEE','ROLE_SYSADMIN','ROLE_BRANCH_MANAGER'].includes(userRole)) {
            localStorage.clear(); window.location.href = 'login.html';
        }
        // Hiện menu quản lý nhân viên nếu là Branch Manager
        document.addEventListener('DOMContentLoaded', () => {
            if (userRole === 'ROLE_BRANCH_MANAGER') {
                const n = document.getElementById('nav-branch-emp');
                if (n) n.style.display = 'flex';
            }
        });

        async function fetchWithAuth(url, options = {}) {
            const res = await fetch(url, {
                ...options,
                headers: { 
                    ...options.headers, 
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': 'application/json'
                }
            });
            if (res.status === 401) {
                localStorage.clear();
                window.location.href = 'login.html';
            }
            return res;
        }

        async function loadRequests() {
            try {
                const endpoint = userRole === 'ROLE_SYSADMIN' ? '/registration/all' : '/registration/branch/list';
                const res = await fetchWithAuth(`${API_BASE}${endpoint}?status=PENDING`);
                currentRequests = await res.json();
                const container = document.getElementById('requests-list');
                container.innerHTML = '';

                if (!currentRequests || currentRequests.length === 0) {
                    container.innerHTML = '<div style="text-align:center; padding:50px; background:white; border-radius:20px;">Hiện không có yêu cầu nào chờ duyệt.</div>';
                    return;
                }

                currentRequests.forEach(req => {
                    const div = document.createElement('div');
                    div.className = 'req-card fade-in';
                    div.innerHTML = `
                        <div class="req-info">
                            <h4>${req.fullName}</h4>
                            <div style="color:var(--mb-blue); font-weight:700; font-size:14px;">Username mong muốn: ${req.desiredUsername}</div>
                            <div class="req-details">
                                <span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2" width="14" height="20" rx="2" ry="2"></rect><line x1="12" y1="18" x2="12.01" y2="18"></line></svg> ${req.phone}</span>
                                <span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg> ${req.cccd}</span>
                            </div>
                        </div>
                        <div class="actions">
                            <button class="btn-details" onclick="showDetails(${req.id})">Chi tiết</button>
                            <button class="btn-reject" onclick="review(${req.id}, 'REJECT')">Từ chối</button>
                            <button class="btn-approve" onclick="review(${req.id}, 'APPROVE')">Duyệt active</button>
                        </div>
                    `;
                    container.appendChild(div);
                });
            } catch (err) { 
                console.error(err);
                document.getElementById('requests-list').innerHTML = '<div style="text-align:center; padding:50px; color:red;">Lỗi tải dữ liệu.</div>';
            }
        }

        function showDetails(id) {
            const req = currentRequests.find(r => r.id === id);
            if (!req) return;

            const content = document.getElementById('modal-content');
            content.innerHTML = `
                <div class="detail-item"><label>Họ và tên</label><p>${req.fullName}</p></div>
                <div class="detail-item"><label>Tên đăng nhập mong muốn</label><p style="color:var(--mb-blue)">${req.desiredUsername}</p></div>
                <div class="detail-item"><label>Số điện thoại</label><p>${req.phone}</p></div>
                <div class="detail-item"><label>Số CCCD/CMND</label><p>${req.cccd}</p></div>
                <div class="detail-item"><label>Email</label><p>${req.email || 'N/A'}</p></div>
                <div class="detail-item"><label>Ngày sinh</label><p>${req.ngaySinh || 'N/A'}</p></div>
                <div class="detail-item" style="grid-column: span 2"><label>Địa chỉ</label><p>${req.address || 'N/A'}</p></div>
                <div class="detail-item"><label>Loại tài khoản</label><p>${req.loaiTK || 'THANH_TOAN'}</p></div>
                <div class="detail-item"><label>Ngày gửi yêu cầu</label><p>${new Date(req.submittedAt).toLocaleString()}</p></div>
                <div class="detail-item"><label>Chi nhánh đăng ký</label><p>${req.branchName} (${req.maChiNhanh})</p></div>
            `;

            document.getElementById('btn-modal-reject').onclick = () => { closeModal(); review(id, 'REJECT'); };
            document.getElementById('btn-modal-approve').onclick = () => { closeModal(); review(id, 'APPROVE'); };
            document.getElementById('details-modal').classList.add('open');
        }

        function closeModal() {
            document.getElementById('details-modal').classList.remove('open');
        }

        async function review(id, action) {
            let reason = action === 'REJECT' ? prompt('Nhập lý do từ chối:') : '';
            if (action === 'REJECT' && reason === null) return;

            try {
                const method = action === 'APPROVE' ? 'approve' : 'reject';
                const options = { method: 'POST' };
                if (action === 'REJECT') {
                    options.body = JSON.stringify({ reason: reason || 'Không đáp ứng yêu cầu' });
                }

                const res = await fetchWithAuth(`${API_BASE}/registration/${id}/${method}`, options);
                if (res.ok) {
                    Swal.fire({
                        title: 'Thành công',
                        text: action === 'APPROVE' ? 'Đã kích hoạt tài khoản thành công!' : 'Đã từ chối yêu cầu.',
                        icon: 'success',
                        confirmButtonText: 'OK',
                        confirmButtonColor: '#0047BA'
                    }).then(() => {
                        if (action === 'APPROVE') {
                            window.location.href = 'customers.html';
                        } else {
                            loadRequests();
                        }
                    });
                } else {
                    const errorData = await res.json();
                    Swal.fire('Lỗi', errorData.message || 'Thao tác thất bại', 'error');
                }
            } catch (err) { Swal.fire('Lỗi', 'Lỗi kết nối', 'error'); }
        }

        loadRequests();
    </script>
</body>
</html>

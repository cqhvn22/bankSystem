<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="../assets/theme.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        .transfer-container { max-width: 550px; margin: 50px auto; padding: 20px; }
        .input-group { margin-bottom: 22px; position: relative; }
        .contact-btn { position: absolute; right: 12px; top: 40px; color: var(--mb-blue); cursor: pointer; background: #eef2f9; border-radius: 8px; padding: 6px 10px; font-size: 12px; font-weight: 700; transition: 0.2s; border: none; }
        .contact-btn:hover { background: var(--mb-blue); color: white; }
        .input-group label { display: block; margin-bottom: 10px; font-weight: 600; color: var(--text-main); font-size: 14px; }
        .input-group input { width: 100%; padding: 16px; border-radius: 14px; border: 2px solid #e9edf7; font-size: 16px; transition: 0.3s; background: #fafbfc; }
        .input-group input:focus { border-color: var(--mb-blue); outline: none; background: white; box-shadow: 0 0 0 4px rgba(0,71,186,0.1); }
        .source-acc { background: linear-gradient(135deg, #f8fafc 0%, #eef2f9 100%); padding: 18px; border-radius: 14px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #e9edf7; }
        .back-btn { display: inline-flex; align-items: center; gap: 8px; color: var(--text-muted); text-decoration: none; font-weight: 600; margin-bottom: 20px; transition: color 0.2s; }
        .back-btn:hover { color: var(--mb-blue); }
    </style>
</head>
<body>
    <div class="loading-overlay" id="loadingOverlay"><div class="spinner"></div></div>
    <div class="transfer-container fade-in">
        <a href="index.html" class="back-btn">← Quay lại</a>
        <div class="logo-container" style="justify-content: center; margin-bottom: 30px;">
            <div class="mb-star"></div><div class="logo-text-group"><div class="logo-main">MB</div><div class="logo-sub">TRANSFER</div></div>
        </div>
        <div class="card" style="padding: 35px;">
            <h3 style="margin-bottom: 30px; text-align: center; font-size: 22px; color: var(--text-main);">Chuyển khoản nội bộ</h3>
            <div id="transfer-msg" style="margin-bottom: 15px; font-weight: bold; text-align: center; display: none;"></div>
            <div class="input-group">
                <label>Tài khoản nguồn</label>
                <div class="source-acc">
                    <div>
                        <div id="source-acc-number" style="font-weight: 700; color: var(--text-main); font-size: 16px;">Đang tải...</div>
                        <div style="font-size: 13px; color: var(--text-muted); margin-top: 5px;">Số dư: <span id="source-acc-balance" style="color: var(--mb-blue); font-weight: 700;">...</span></div>
                    </div>
                </div>
            </div>
            
            <div class="input-group">
                <label>Số tài khoản thụ hưởng</label>
                <div style="position: relative;">
                    <input type="text" id="target-account" placeholder="Nhập STK MB Bank">
                    <button class="contact-btn" onclick="openContactModal()">DANH BẠ</button>
                </div>
                <div id="target-account-name" style="margin-top: 8px; font-size: 13px; font-weight: 600; display: none;"></div>
            </div>
            
            <div class="input-group">
                <label>Số tiền (VND)</label>
                <input type="number" id="amount" placeholder="0" step="1" oninput="this.value = this.value.replace(/[^0-9]/g, '')">
            </div>
            
            <div class="input-group">
                <label>Lời nhắn</label>
                <input type="text" id="content" value="Chuyển tiền">
            </div>
            
            <button class="btn-primary" onclick="doTransfer()" style="width: 100%; font-size: 16px; padding: 18px; margin-top: 15px; border-radius: 14px;">TIẾP TỤC</button>
        </div>
    </div>
    <script>
        let myAccountNum = '';
        document.addEventListener('DOMContentLoaded', async () => {
            const token = localStorage.getItem('token');
            const role = localStorage.getItem('userRole');

            if (!token || role !== 'ROLE_CUSTOMER') {
                localStorage.clear();
                window.location.href = 'login.html';
                return;
            }

            try {
                const res = await fetch('/api/account/my-accounts', {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                
                if (res.ok) {
                    const accounts = await res.json();
                    if (accounts.length > 0) {
                        const acc = accounts[0];
                        myAccountNum = acc.accountNumber;
                        document.getElementById('source-acc-balance').innerText = new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(acc.balance);
                        document.getElementById('source-acc-number').innerText = acc.accountNumber;
                        
                        const username = localStorage.getItem('username');
                        document.getElementById('content').value = username + " chuyen tien";
                    }
                } else if (res.status === 401) {
                    localStorage.clear();
                    window.location.href = 'login.html';
                }
            } catch (e) {}
        });

        let typingTimer;
        document.getElementById('target-account').addEventListener('input', function(e) {
            clearTimeout(typingTimer);
            const val = e.target.value.trim();
            const nameBox = document.getElementById('target-account-name');
            
            if (val.length < 5) {
                nameBox.style.display = 'none';
                return;
            }

            if (val === myAccountNum) {
                nameBox.style.display = 'block';
                nameBox.style.color = 'var(--mb-red)';
                nameBox.innerText = '❌ Không thể chuyển khoản cho chính mình';
                return;
            }
            
            nameBox.style.display = 'block';
            nameBox.style.color = '#888';
            nameBox.innerText = 'Đang kiểm tra...';
            
            typingTimer = setTimeout(async () => {
                try {
                    const token = localStorage.getItem('token');
                    const res = await fetch('/api/account/check?accountNumber=' + val, {
                        headers: { 'Authorization': 'Bearer ' + token }
                    });
                    if (res.ok) {
                        const acc = await res.json();
                        nameBox.style.color = 'var(--mb-blue)';
                        nameBox.innerText = acc.customerName ? ('👤 Tên thụ hưởng: ' + acc.customerName) : '✅ Tài khoản hợp lệ';
                    } else {
                        nameBox.style.color = 'var(--mb-red)';
                        nameBox.innerText = '❌ Không tìm thấy tài khoản';
                    }
                } catch(err) {
                    nameBox.style.color = 'var(--mb-red)';
                    nameBox.innerText = '❌ Lỗi khi kiểm tra';
                }
            }, 600);
        });

        async function openContactModal() {
            showLoading();
            try {
                const token = localStorage.getItem('token');
                const res = await fetch('/api/contacts/list', {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                if (res.ok) {
                    const contacts = await res.json();
                    if (contacts.length === 0) {
                        Swal.fire('Thông báo', 'Danh bạ của bạn đang trống. Thực hiện chuyển tiền để tự động lưu người nhận.', 'info');
                        return;
                    }
                    
                    let contactHtml = '<div style="max-height: 300px; overflow-y: auto;">';
                    contacts.forEach(c => {
                        contactHtml += `
                            <div onclick="selectContact('${c.accountNumber}', '${c.fullName}')" 
                                 style="padding: 15px; border-bottom: 1px solid #eee; cursor: pointer; text-align: left; transition: 0.2s;"
                                 onmouseover="this.style.background='#f0f4ff'" onmouseout="this.style.background='white'">
                                <div style="font-weight: 700; color: var(--text-main);">${c.fullName}</div>
                                <div style="font-size: 13px; color: var(--mb-blue); font-weight: 600;">${c.accountNumber}</div>
                            </div>`;
                    });
                    contactHtml += '</div>';

                    Swal.fire({
                        title: 'Chọn người nhận',
                        html: contactHtml,
                        showConfirmButton: false,
                        showCloseButton: true
                    });
                }
            } catch (err) {
                Swal.fire('Lỗi', 'Không thể tải danh bạ', 'error');
            } finally {
                hideLoading();
            }
        }

        window.selectContact = function(acc, name) {
            document.getElementById('target-account').value = acc;
            Swal.close();
            // Trigger input event to check account name
            document.getElementById('target-account').dispatchEvent(new Event('input'));
        }

        async function doTransfer() {
            const toAcc = document.getElementById('target-account').value;
            const amount = document.getElementById('amount').value;
            const content = document.getElementById('content').value;

            if (!toAcc || !amount || amount <= 0 || !Number.isInteger(Number(amount))) {
                Swal.fire('Lỗi', 'Vui lòng nhập số tài khoản và số tiền hợp lệ.', 'error');
                return;
            }

            if (toAcc === myAccountNum) {
                Swal.fire('Lỗi', 'Không thể chuyển tiền cho chính mình!', 'error');
                return;
            }

            const confirmResult = await Swal.fire({
                title: 'Xác nhận chuyển tiền',
                html: `Chuyển <b>${new Intl.NumberFormat('vi-VN').format(amount)} VND</b> đến tài khoản <br><b>${toAcc}</b>?`,
                icon: 'question',
                showCancelButton: true,
                confirmButtonText: 'Xác nhận',
                cancelButtonText: 'Hủy'
            });

            if (!confirmResult.isConfirmed) return;

            showLoading();
            const token = localStorage.getItem('token');
            try {
                const res = await fetch('/api/transaction/transfer', {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + token
                    },
                    body: JSON.stringify({
                        fromAccount: myAccountNum,
                        toAccount: toAcc,
                        amount: amount,
                        content: content
                    })
                });

                if (res.ok) {
                    Swal.fire({
                        icon: 'success',
                        title: 'Giao dịch thành công',
                        text: 'Tiền đã được chuyển đến người nhận.',
                        timer: 2000,
                        showConfirmButton: false
                    }).then(() => location.href = 'index.html');
                } else {
                    const data = await res.json();
                    Swal.fire('Giao dịch thất bại', data.message || "Lỗi giao dịch.", 'error');
                }
            } catch (e) {
                Swal.fire('Lỗi kết nối', 'Không thể kết nối máy chủ!', 'error');
            } finally {
                hideLoading();
            }
        }

        function showLoading() { document.getElementById('loadingOverlay').classList.add('show'); }
        function hideLoading() { document.getElementById('loadingOverlay').classList.remove('show'); }
    </script>
</body>
</html>

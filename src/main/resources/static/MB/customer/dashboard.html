<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>MB Bank - Trang chủ</title>
    <link rel="stylesheet" href="../assets/theme.css">
    <style>
        .container { max-width: 900px; margin: 0 auto; padding: 40px 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; }
        .user-profile { position: relative; display: flex; align-items: center; gap: 10px; font-weight: 600; cursor: pointer; padding: 8px 15px; border-radius: 12px; transition: background 0.2s; user-select: none; }
        .user-profile:hover { background: white; box-shadow: var(--shadow); }
        .user-avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--mb-blue); color: white; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700; }
        .dropdown-menu { display: none; position: absolute; top: calc(100% + 8px); right: 0; background: white; border-radius: 14px; box-shadow: 0 10px 40px rgba(0,0,0,0.12); min-width: 200px; z-index: 100; overflow: hidden; border: 1px solid #eef0f4; }
        .dropdown-menu.open { display: block; animation: fadeDown 0.15s ease; }
        @keyframes fadeDown { from { opacity:0; transform:translateY(-8px); } to { opacity:1; transform:translateY(0); } }
        .dropdown-item { display: flex; align-items: center; gap: 10px; padding: 13px 18px; font-size: 14px; font-weight: 500; color: #444; cursor: pointer; transition: 0.15s; text-decoration: none; }
        .dropdown-item:hover { background: #f5f7ff; color: var(--mb-blue); }
        .dropdown-item.danger:hover { background: #fff0f0; color: var(--mb-red); }
        .dropdown-divider { height: 1px; background: #eef0f4; margin: 4px 0; }
        .welcome-section { margin-bottom: 35px; }
        .welcome-section h2 { font-size: 26px; color: var(--text-main); margin-bottom: 5px; }
        .balance-card { background: linear-gradient(135deg, var(--mb-blue) 0%, var(--mb-blue-dark) 100%); color: white; position: relative; overflow: hidden; border: none; padding: 35px; box-shadow: 0 15px 35px rgba(0,71,186,0.2); }
        .balance-card::after { content: ""; position: absolute; right: -50px; top: -50px; width: 250px; height: 250px; background: rgba(255,255,255,0.06); border-radius: 50%; }
        .balance-card::before { content: ""; position: absolute; left: -30px; bottom: -80px; width: 150px; height: 150px; background: rgba(255,255,255,0.04); border-radius: 50%; }
        .balance-meta { font-size: 13px; opacity: 0.75; margin-top: 6px; }
        .quick-actions { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-top: 35px; }
        .action-item { text-align: center; cursor: pointer; transition: 0.3s; padding: 20px 10px; border-radius: 20px; background: white; box-shadow: var(--shadow); border: 1px solid rgba(255,255,255,0.5); text-decoration: none; color: inherit; display: block; }
        .action-item:hover { transform: translateY(-5px); box-shadow: 0 15px 40px rgba(112,144,176,0.15); }
        .action-icon { width: 65px; height: 65px; background: var(--bg-light); border-radius: 20px; display: flex; align-items: center; justify-content: center; margin: 0 auto 15px; font-size: 28px; transition: 0.3s; color: var(--mb-blue); }
        .action-item:hover .action-icon { background: var(--mb-blue); color: white; }
        .action-item p { font-weight: 600; font-size: 14px; }
        .recent-tx { margin-top: 40px; }
        .recent-tx-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .tx-row { display: flex; justify-content: space-between; align-items: center; padding: 14px 0; border-bottom: 1px solid #eef0f4; }
        .tx-row:last-child { border-bottom: none; }
        .tx-icon { width: 45px; height: 45px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 20px; margin-right: 14px; flex-shrink: 0; }
        .tx-out { background: #ffe5e6; color: var(--mb-red); }
        .tx-in  { background: #e6f9ee; color: #28a745; }
    </style>
</head>
<body>
<div class="container fade-in">
    <header class="header">
        <div class="logo-container">
            <div class="mb-star"></div>
            <div class="logo-text-group">
                <div class="logo-main">MB</div>
                <div class="logo-sub">BANK</div>
            </div>
        </div>
        <div class="user-profile" id="user-profile-btn">
            <div class="user-avatar" id="avatar-letter">M</div>
            <span id="display-username">Đang tải... ▾</span>
            <div class="dropdown-menu" id="user-dropdown">
                <div class="dropdown-item">👤 &nbsp;<span id="dropdown-name">Tài khoản</span></div>
                <div class="dropdown-divider"></div>
                <a href="history.html" class="dropdown-item">📊 &nbsp;Lịch sử giao dịch</a>
                <a href="transfer.html" class="dropdown-item">💸 &nbsp;Chuyển tiền</a>
                <div class="dropdown-divider"></div>
                <div class="dropdown-item danger" onclick="doLogout()">🚪 &nbsp;Đăng xuất</div>
            </div>
        </div>
    </header>

    <section class="welcome-section">
        <h2 id="welcome-name">Đang tải...</h2>
        <p style="color: var(--text-muted); font-size: 15px;">Chúc bạn một ngày giao dịch thuận lợi.</p>
    </section>

    <div class="card balance-card">
        <p style="opacity:0.85; font-size:15px; font-weight:500;">Số dư khả dụng</p>
        <h1 id="display-balance" style="font-size:42px; margin:12px 0; font-weight:800; letter-spacing:-1px;">...</h1>
        <div style="display:flex; align-items:center; gap:12px; flex-wrap:wrap;">
            <p style="font-size:15px; opacity:0.9; font-weight:500;">
                <span id="display-acc-number">Số tài khoản: ...</span>
                <span onclick="copyAccNumber()" style="cursor:pointer; margin-left:10px; background:rgba(255,255,255,0.2); padding:4px 10px; border-radius:6px; font-size:12px;" title="Sao chép">Sao chép</span>
            </p>
        </div>
        <p class="balance-meta" id="display-acc-type"></p>
    </div>

    <div class="quick-actions">
        <a href="transfer.html" class="action-item">
            <div class="action-icon">💸</div>
            <p>Chuyển tiền</p>
        </a>
        <a href="#" class="action-item">
            <div class="action-icon">📱</div>
            <p>Nạp điện thoại</p>
        </a>
        <a href="#" class="action-item">
            <div class="action-icon">🧾</div>
            <p>Thanh toán HĐ</p>
        </a>
        <a href="history.html" class="action-item">
            <div class="action-icon">📊</div>
            <p>Lịch sử GD</p>
        </a>
    </div>

    <div class="recent-tx">
        <div class="recent-tx-header">
            <h3>Giao dịch gần đây</h3>
            <a href="history.html" style="color:var(--mb-blue); text-decoration:none; font-weight:600; font-size:14px;">Xem tất cả</a>
        </div>
        <div class="card" id="recent-tx-list">
            <p style="text-align:center; color:#aaa; padding:20px;">Đang tải...</p>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', async () => {
    const token    = localStorage.getItem('jwtToken');
    const username = localStorage.getItem('username');
    const fullName = localStorage.getItem('fullName') || username;

    if (!token) { window.location.href = 'login.html'; return; }

    // Avatar letter
    document.getElementById('avatar-letter').innerText   = (fullName || 'M').charAt(0).toUpperCase();
    document.getElementById('display-username').innerText = (fullName || username) + ' ▾';
    document.getElementById('dropdown-name').innerText    = fullName || username;
    document.getElementById('welcome-name').innerText     = 'Chào, ' + (fullName || username) + '!';

    // Dropdown toggle
    const profileBtn = document.getElementById('user-profile-btn');
    const dropdown   = document.getElementById('user-dropdown');
    profileBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        dropdown.classList.toggle('open');
    });
    document.addEventListener('click', () => dropdown.classList.remove('open'));
    dropdown.addEventListener('click', e => e.stopPropagation());

    // Load accounts
    try {
        const res = await fetch('/api/account/my-accounts', {
            headers: { 'Authorization': 'Bearer ' + token }
        });
        if (res.status === 401) { localStorage.clear(); window.location.href = 'login.html'; return; }
        if (res.ok) {
            const accounts = await res.json();
            if (accounts.length > 0) {
                const acc = accounts[0];
                document.getElementById('display-balance').innerText =
                    new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(acc.balance);
                document.getElementById('display-acc-number').innerText = 'Số tài khoản: ' + acc.accountNumber;
                if (acc.loaiTK)
                    document.getElementById('display-acc-type').innerText = 'Loại TK: ' + acc.loaiTK + (acc.ngayMo ? '  |  Ngày mở: ' + acc.ngayMo : '');
            }
        }
    } catch(e) {}

    // Load recent transactions
    try {
        // We'll show last 5 from my-accounts then history
        const accRes = await fetch('/api/account/my-accounts', { headers: { 'Authorization': 'Bearer ' + token } });
        if (accRes.ok) {
            const accs = await accRes.json();
            if (accs.length > 0) {
                const txRes = await fetch('/api/transaction/history/' + accs[0].accountNumber, {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                if (txRes.ok) {
                    const txs = await txRes.json();
                    renderRecentTx(txs.slice(0, 5), accs[0].accountNumber);
                }
            }
        }
    } catch(e) {}
});

function renderRecentTx(txs, myAcc) {
    const el = document.getElementById('recent-tx-list');
    if (!txs || txs.length === 0) {
        el.innerHTML = '<p style="text-align:center; color:#aaa; padding:20px;">Chưa có giao dịch nào.</p>';
        return;
    }
    el.innerHTML = txs.map(tx => {
        const isOut = tx.fromAccount && tx.fromAccount.accountNumber === myAcc;
        const iconCls = isOut ? 'tx-out' : 'tx-in';
        const icon = isOut ? '↑' : '↓';
        const sign = isOut ? '-' : '+';
        const color = isOut ? 'var(--mb-red)' : '#28a745';
        const counterpart = isOut
            ? (tx.toAccount ? tx.toAccount.accountNumber : '—')
            : (tx.fromAccount ? tx.fromAccount.accountNumber : 'Nạp tiền');
        const d = new Date(tx.timestamp);
        const dateStr = d.toLocaleDateString('vi-VN');
        const amt = new Intl.NumberFormat('vi-VN').format(tx.amount) + ' VND';
        return `<div class="tx-row">
            <div style="display:flex; align-items:center;">
                <div class="tx-icon ${iconCls}">${icon}</div>
                <div>
                    <p style="font-weight:700; font-size:15px;">${tx.content || (isOut ? 'Chuyển tiền' : 'Nhận tiền')}</p>
                    <p style="font-size:12px; color:var(--text-muted); margin-top:3px;">${counterpart} · ${dateStr}</p>
                </div>
            </div>
            <p style="color:${color}; font-weight:700; font-size:16px;">${sign} ${amt}</p>
        </div>`;
    }).join('');
}

function copyAccNumber() {
    const txt = document.getElementById('display-acc-number').innerText.replace('Số tài khoản: ', '');
    navigator.clipboard.writeText(txt).then(() => alert('Đã sao chép: ' + txt));
}

function doLogout() {
    localStorage.clear();
    window.location.href = 'login.html';
}
</script>
</body>
</html>
